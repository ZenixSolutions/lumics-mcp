version: 2

# See docs/DEPENDENCY_POLICY.md. Dependabot proposes; it does not decide. Every
# pull request it opens goes through the same review as any other change: CI
# green plus one non-author approval. Because dependencies are pinned to exact
# versions, these pull requests edit package.json as well as the lockfile —
# that visibility is the point.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    versioning-strategy: increase
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: 'build'
      prefix-development: 'build'
      include: scope
    groups:
      # Patch and minor updates are grouped so the queue stays reviewable.
      production-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # npm majors are not proposed at all. Note that this is *suppression*, not
      # the "raised individually" that docs/DEPENDENCY_POLICY.md describes —
      # `ignore` stops Dependabot opening the pull request, it does not split it
      # out. Upgrading a runtime or toolchain major here is therefore a manual,
      # deliberate act, which matches the exact-version pinning philosophy but
      # not the wording of the policy. See the pull request that added this
      # comment; resolving the mismatch needs an owner decision.
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'ci'
      include: scope
    groups:
      # Actions are pinned by tag in the workflows. Keeping those pins current
      # is what stops the pin becoming an excuse to run stale, unpatched CI.
      #
      # Minor and patch only. A major is a breaking change to something that
      # runs with repository credentials, and docs/DEPENDENCY_POLICY.md requires
      # each one to be raised separately and merged only after its upstream
      # changelog has been read. Grouping them defeats that: PR #6 arrived as
      # three majors in one diff, two of which touched release.yml — a workflow
      # that runs only on tags and so is never exercised by pull-request CI.
      # Excluding majors here does not silence them; Dependabot raises each one
      # as its own pull request.
      github-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
